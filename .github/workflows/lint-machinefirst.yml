name: Validate MACHINEFIRST.md Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned artifact SHA-256 digests
        run: sha256sum -c MACHINEFIRST.sha256
      - name: Validate MACHINEFIRST.md (strict + mirror check)
        run: python validate_machinefirst.py MACHINEFIRST.md --strict --mirror-path machinefirst.txt
